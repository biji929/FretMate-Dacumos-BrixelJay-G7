{% extends 'base.html' %}
{% block title %}Settings — FretMate{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-zinc-900 p-8 rounded-2xl shadow-sm border border-zinc-200 dark:border-zinc-800">
    <h2 class="text-2xl font-black mb-6 text-zinc-900 dark:text-white">Settings</h2>
    <form method="post" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-700 dark:text-zinc-300 mb-2">Skill Level</label>
            <select name="skill_level" class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-rose-500">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-700 dark:text-zinc-300 mb-2">Weekly Goal (minutes)</label>
            <input type="number" name="weekly_goal" value="120" class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold rounded-xl shadow-md shadow-rose-600/30 transition active:scale-95 cursor-pointer">Save Settings</button>
    </form>
</div>
{% endblock %}
