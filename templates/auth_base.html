{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FretMate – {% block page_title %}Welcome{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">
    <!-- Modern Typography: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid #f43f5e !important;
            outline-offset: 2px !important;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-zinc-950 via-zinc-900 to-rose-950 text-zinc-100 flex items-center justify-center px-4 antialiased selection:bg-rose-600 selection:text-white">

    <!-- Decorative Electric Crimson & Obsidian atmospheric stage glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-red-600/15 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-rose-950/40 rounded-full blur-2xl"></div>
    </div>

    <div class="relative z-10 w-full max-w-md py-8">
        <!-- Logo / Brand -->
        <div class="text-center mb-8">
            <a href="{% url 'home' %}" class="inline-flex items-center justify-center mb-4 rounded-2xl shadow-xl shadow-rose-600/30 hover:shadow-rose-500/50 transition-shadow duration-200" title="Return to Landing Page">
                <img src="{% static 'images/logo.svg' %}" alt="FretMate logo" width="56" height="56" class="w-14 h-14 rounded-2xl">
            </a>
            <h1 class="text-3xl font-black tracking-tight text-white">FretMate</h1>
            <p class="text-zinc-400 text-sm mt-1">Your Guitar Practice Companion</p>
        </div>

        <!-- Messages -->
        {% if messages %}
            <div class="space-y-2 mb-4">
                {% for message in messages %}
                    <div class="p-3.5 rounded-xl text-xs font-semibold border flex items-center justify-between shadow-sm
                        {% if message.tags == 'success' %} bg-emerald-500/15 border-emerald-500/30 text-emerald-300
                        {% elif message.tags == 'error' %} bg-rose-500/20 border-rose-500/40 text-rose-200
                        {% else %} bg-rose-500/15 border-rose-500/30 text-rose-200 {% endif %}">
                        <span>{{ message }}</span>
                        <button type="button" onclick="this.parentElement.remove()" class="text-xs opacity-60 hover:opacity-100 font-bold ml-2 cursor-pointer">✕</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Card -->
        <div class="bg-zinc-900/90 backdrop-blur-md border border-zinc-800 rounded-3xl p-7 sm:p-8 shadow-2xl">
            {% block auth_content %}{% endblock %}
        </div>

        <!-- Footer note -->
        <p class="text-center text-xs text-zinc-500 mt-6">© FretMate · Practice smarter, play better</p>
    </div>

    <script>
        const html = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }
    </script>
</body>
</html>
