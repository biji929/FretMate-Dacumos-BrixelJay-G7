<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="FretMate Logo">
  <defs>
    <linearGradient id="fmBg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="55%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="fmPick" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
  </defs>

  <!-- Rounded Obsidian/Crimson Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fmBg)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Minimal Guitar Pick Silhouette -->
  <path
    d="M32 12.5C44.5 12.5 50.5 17.5 49.5 27.5C48.5 37.8 38.5 51.5 32 51.5C25.5 51.5 15.5 37.8 14.5 27.5C13.5 17.5 19.5 12.5 32 12.5Z"
    fill="url(#fmPick)"
  />

  <!-- Minimalist Fretboard Nut + 3 Strings -->
  <line x1="22.5" y1="22.5" x2="41.5" y2="22.5" stroke="#be123c" stroke-width="2.6" stroke-linecap="round" />
  <line x1="25" y1="22.5" x2="25" y2="35.5" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="22.5" x2="32" y2="41.5" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" />
  <line x1="39" y1="22.5" x2="39" y2="35.5" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" />

  <!-- Root Fret Note Dot -->
  <circle cx="32" cy="31.5" r="4.2" fill="#e11d48" />
  <circle cx="32" cy="31.5" r="1.6" fill="#ffffff" />
</svg>
